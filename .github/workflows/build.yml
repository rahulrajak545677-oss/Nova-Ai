name: Build NOVA APK from zip
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q nova-ai-android.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install and set up
        working-directory: nova-ai-android
        run: |
          npm install
          node setup.js
      - name: Build debug APK
        working-directory: nova-ai-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nova-ai-debug-apk
          path: nova-ai-android/android/app/build/outputs/apk/debug/app-debug.apk
